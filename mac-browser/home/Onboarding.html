<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to TrailBrowser</title>
  <link rel="stylesheet" href="Onboarding.css">
</head>
<body>
  <main class="welcome">
    <div class="orb"></div>
    <h1>Welcome to TrailBrowser</h1>
    <p class="lede">A fast, native browser built on system WebKit. Let's get you set up.</p>

    <section class="card">
      <div class="card-text">
        <h2>Stay signed in</h2>
        <p>Sync cookies from a local Google Chrome profile so you stay signed in
          to your sites — and skip "unusual traffic" checks on signed-out sessions.</p>
      </div>
      <button id="sync-cookies" class="primary" type="button">Sync Chrome Cookies</button>
    </section>

    <button id="get-started" class="cta" type="button">Get started</button>
    <button id="skip" class="link" type="button">Skip for now</button>
  </main>

  <script src="Onboarding.js"></script>
</body>
</html>
