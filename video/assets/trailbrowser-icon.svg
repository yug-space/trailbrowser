<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e24"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="trail" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#f76b1c"/>
    </linearGradient>
    <radialGradient id="summit" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffd9b0"/>
      <stop offset="0.55" stop-color="#f76b1c"/>
      <stop offset="1" stop-color="#f76b1c"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="rgba(255,255,255,0.09)"/>
  <!-- top sheen -->
  <rect x="16" y="16" width="480" height="240" rx="108" fill="white" opacity="0.04"/>

  <!-- glow under the trail -->
  <path d="M170 392 C250 378 298 330 286 286 C276 246 200 240 192 200 C186 166 248 156 342 132"
        fill="none" stroke="#f76b1c" stroke-width="26" stroke-linecap="round" opacity="0.35" filter="url(#glow)"/>
  <!-- the trail -->
  <path d="M170 392 C250 378 298 330 286 286 C276 246 200 240 192 200 C186 166 248 156 342 132"
        fill="none" stroke="url(#trail)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- waypoints -->
  <circle cx="170" cy="392" r="15" fill="#0a0a0b" stroke="url(#trail)" stroke-width="9"/>
  <circle cx="286" cy="286" r="13" fill="#f76b1c"/>
  <circle cx="192" cy="200" r="13" fill="#f76b1c"/>
  <!-- summit (the "Ready" destination) -->
  <circle cx="342" cy="132" r="34" fill="#f76b1c" opacity="0.25" filter="url(#glow)"/>
  <circle cx="342" cy="132" r="22" fill="url(#summit)"/>
</svg>
